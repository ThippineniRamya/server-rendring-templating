<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<body>
    <h1>Our Products</h1>

    {% for p in products %}
        <div>
            <h2>{{ p[1] }}</h2>
            <p>Product ID: {{ p[0] }}</p>
            <p>Price: ₹{{ p[2] }}</p>
        </div>
        <hr>
    {% endfor %}
</body>
</html>
